name: publish

# Runs when a GitHub release is published. npm trusted publishing authenticates
# this workflow through OIDC, so no npm token is stored anywhere.
# Why: docs/knowledge/releases.md
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Prereleases would otherwise publish as "latest".
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "Release tag $TAG does not match package.json $version" >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: npm is new enough for trusted publishing (11.5.1+)
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$(npm -v)"
      - run: npm test
      - run: npm publish --provenance --access public
